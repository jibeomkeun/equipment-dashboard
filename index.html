function handleFile(input){
  const file=input.files[0]; if(!file)return;
  document.getElementById('fileName').textContent='처리중: '+file.name;
  document.getElementById('fileStatus').textContent='⏳ 분석중...';
  document.getElementById('fileStatus').style.color='#f59e0b';
  document.getElementById('loadingOverlay').classList.add('show');
  const reader=new FileReader();
  reader.onload=function(e){
    setTimeout(function(){
      try{
        const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
        const nd=processWorkbook(wb);
        if(nd){D=nd;renderAll();
          document.getElementById('fileName').textContent='현재: '+file.name;
          document.getElementById('fileStatus').textContent='✓ 로드완료 ('+D.totalRec+'건)';
          document.getElementById('fileStatus').style.color='#22c55e';
        }
      }catch(err){alert('오류: '+err.message);document.getElementById('fileStatus').textContent='✗ 오류';document.getElementById('fileStatus').style.color='#ef4444'}
      document.getElementById('loadingOverlay').classList.remove('show');
      input.value='';
    },50);
  };
  reader.readAsArrayBuffer(file);
}

function processWorkbook(wb){
  let allRows=[];
  wb.SheetNames.forEach(sn=>{
    if(!sn.includes('调整履历'))return;
    const raw=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:null,raw:false});
    if(raw.length<3)return;
    for(let i=2;i<raw.length;i++){
      const r=raw[i]; if(!r||!r[3]||!r[4])continue;
      const cat=(r[13]||'').toString().trim();
      if(cat!=='PM调整')continue;
      const sub=(r[14]||'').toString().trim();
      if(sub==='停机'||sub==='开机'||!sub)continue;
      let dt=r[3],dateStr='';
      if(dt instanceof Date){try{dateStr=new Date(dt).toLocaleDateString('en-CA')}catch(e){continue}}
      else if(typeof dt==='string'){dateStr=dt}
      else if(typeof dt==='number'){const d=new Date((dt-25569)*86400000);dateStr=d.toISOString().slice(0,10)}
      if(!dateStr)continue;
      const mm=String(new Date(dateStr).getMonth()+1).padStart(2,'0');
      const dd=String(new Date(dateStr).getDate()).padStart(2,'0');
      const ds=mm+'/'+dd;
      const eq=(r[4]||'').toString().trim().toUpperCase();
      if(!eq)continue;
      const stopTime=parseFloat(r[11])||0, nonStopTime=parseFloat(r[12])||0;
      const time=Math.max(stopTime,nonStopTime);
      if(time>1000)continue;
      const defect=parseFloat(r[18])||0;
      const stopYN=(r[19]||'').toString().trim();
      const line=eq[0]; // G, H, K
      allRows.push({ds,eq,sub,defect,time,stop:stopYN==='停',line,dateStr});
    }
  });
  if(allRows.length===0){alert('PM调整 데이터가 없습니다.');return null}

  const all_dates=[...new Set(allRows.map(r=>r.ds))].sort();
  const eqCnt={};allRows.forEach(r=>{eqCnt[r.eq]=(eqCnt[r.eq]||0)+1});
  const eq_order=Object.entries(eqCnt).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);

  // Daily total
  function buildDaily(rows){
    const m={};
    rows.forEach(r=>{
      if(!m[r.ds])m[r.ds]={일자str:r.ds,cnt:0,defect:0,time:0,stop:0};
      m[r.ds].cnt++;m[r.ds].defect+=r.defect;m[r.ds].time+=r.time;if(r.stop)m[r.ds].stop++;
    });
    return all_dates.map(d=>m[d]||{일자str:d,cnt:0,defect:0,time:0,stop:0});
  }
  const daily=buildDaily(allRows);
  const daily_G=buildDaily(allRows.filter(r=>r.line==='G'));
  const daily_H=buildDaily(allRows.filter(r=>r.line==='H'));
  const daily_K=buildDaily(allRows.filter(r=>r.line==='K'));

  // Heatmaps
  const hdMap={},htMap={};
  allRows.forEach(r=>{let k=r.eq+'|'+r.ds;hdMap[k]=(hdMap[k]||0)+r.defect;htMap[k]=(htMap[k]||0)+r.time});
  const hm_def=Object.entries(hdMap).map(([k,v])=>{const[e,d]=k.split('|');return{설비호:e,일자str:d,불량수량:v}});
  const hm_time=Object.entries(htMap).map(([k,v])=>{const[e,d]=k.split('|');return{설비호:e,일자str:d,time:v}});

  // Line equips
  const line_equips={G:[],H:[],K:[]};
  eq_order.forEach(eq=>{const ln=eq[0];if(line_equips[ln])line_equips[ln].push(eq)});

  const lines=['G','H','K'];
  const lineSummary={};
  lines.forEach(ln=>{lineSummary[ln]={cnt:allRows.filter(r=>r.line===ln).length,eq:line_equips[ln].length}});

  return {
    daily,daily_G,daily_H,daily_K,all_dates,eq_order,line_equips,
    hm_def,hm_time,allRows,
    totalRec:allRows.length,totalDef:Math.round(allRows.reduce((s,r)=>s+r.defect,0)),
    totalTime:Math.round(allRows.reduce((s,r)=>s+r.time,0)),
    stopCnt:allRows.filter(r=>r.stop).length,
    eqCnt:eq_order.length,probCnt:new Set(allRows.map(r=>r.sub)).size,
    dateRange:all_dates[0]+' ~ '+all_dates[all_dates.length-1],
    lineSummary
  };
}

function go(i){document.querySelectorAll('.pn').forEach((p,x)=>p.classList.toggle('on',x===i));document.querySelectorAll('.tab').forEach((t,x)=>t.classList.toggle('on',x===i))}
function hcl(v,mx){if(!v||v===0)return'h0';let r=v/mx;return r<.08?'h1':r<.2?'h2':r<.35?'h3':r<.55?'h4':r<.75?'h5':'h6'}

function buildDailyHT(data,vk,equips,dates){
  let lk={},mx=0;
  data.forEach(r=>{let k=r['설비호']+'|'+r['일자str'];let v=r[vk]||0;lk[k]=v;if(v>mx)mx=v});
  let et=equips.map(e=>({e,t:dates.reduce((s,d)=>s+(lk[e+'|'+d]||0),0)})).sort((a,b)=>b.t-a.t).map(x=>x.e);
  let h='<table class="ht"><thead><tr><th>설비\\일자</th>';
  dates.forEach(d=>h+='<th>'+d+'</th>');
  h+='<th style="background:#1e40af">합계</th></tr></thead><tbody>';
  const sortField=vk==='time'?'time':'defect';
  et.forEach(eq=>{h+='<tr><th>'+eq+'</th>';let rs=0;dates.forEach(d=>{let v=lk[eq+'|'+d]||0;rs+=v;
    if(v){h+='<td class="'+hcl(v,mx)+' hm-click" onclick="showDetail(\''+eq+'\',\''+d+'\',\''+sortField+'\')">'+ Math.round(v)+'</td>'}
    else{h+='<td class="'+hcl(v,mx)+'"></td>'}
  });h+='<td style="background:#1e3a5f;font-weight:700;color:#60a5fa">'+Math.round(rs)+'</td></tr>'});
  h+='<tr><th style="background:#1e40af">합계</th>';let gt=0;
  dates.forEach(d=>{let cs=et.reduce((s,e)=>s+(lk[e+'|'+d]||0),0);gt+=cs;h+='<td style="background:#1e3a5f;font-weight:700;color:#60a5fa">'+Math.round(cs)+'</td>'});
  h+='<td style="background:#1e40af;font-weight:700;color:#fcd34d">'+Math.round(gt)+'</td></tr></tbody></table>';
  return h
}

function showDetail(eq,date,sortBy){
  const rows=(D.allRows||[]).filter(r=>r.eq===eq&&r.ds===date);
  if(!rows.length){
    document.getElementById('modalTitle').textContent=eq+' · '+date+' — 데이터 없음 (파일 업로드 시 상세 이력 표시)';
    document.getElementById('modalBody').innerHTML='<p style="color:#94a3b8;padding:20px 0">임베디드 데이터에는 개별 이력이 포함되어 있지 않습니다.<br>엑셀 파일을 업로드하면 상세 이력을 확인할 수 있습니다.</p>';
    document.getElementById('modalOverlay').classList.add('show');
    return;
  }
  rows.sort((a,b)=>b[sortBy]-a[sortBy]);
  const totalDef=rows.reduce((s,r)=>s+r.defect,0);
  const totalTime=rows.reduce((s,r)=>s+r.time,0);
  const label=sortBy==='defect'?'불량수량':'조정시간';
  document.getElementById('modalTitle').textContent=eq+' · '+date+' 상세이력 ('+label+' 내림차순, '+rows.length+'건)';
  let t='<table><thead><tr><th>#</th><th>조정항목</th><th>불량수량</th><th>시간(분)</th><th>정지</th></tr></thead><tbody>';
  rows.forEach((r,i)=>{
    const defCls=sortBy==='defect'&&i===0?' class="highlight"':'';
    const timeCls=sortBy==='time'&&i===0?' class="highlight"':'';
    t+='<tr><td>'+(i+1)+'</td><td>'+r.sub+'</td><td'+defCls+'>'+Math.round(r.defect).toLocaleString()+'</td><td'+timeCls+'>'+Math.round(r.time)+'</td><td>'+(r.stop?'⛔':'')+'</td></tr>';
  });
  t+='<tr style="background:#334155;font-weight:700"><td></td><td>합계</td><td>'+Math.round(totalDef).toLocaleString()+'</td><td>'+Math.round(totalTime)+'</td><td></td></tr>';
  t+='</tbody></table>';
  document.getElementById('modalBody').innerHTML=t;
  document.getElementById('modalOverlay').classList.add('show');
}

    x:{ticks:{color:'#94a3b8',font:{size:10}},grid:{color:'#1e293b'}},
    y:{position:'left',ticks:{color:barColor},grid:{color:'#334155'},title:{display:true,text:'건수',color:barColor,font:{size:10}}},
    y1:{position:'right',ticks:{color:'#ef4444',font:{size:9}},grid:{drawOnChartArea:false},title:{display:true,text:'불량/시간',color:'#ef4444',font:{size:10}}}
  }};
  return new Chart(canvasId,{type:'bar',data:{labels:data.map(r=>r['일자str']),datasets:[
    {label:'건수',data:data.map(r=>r.cnt),backgroundColor:barColor+'B3',borderRadius:4,yAxisID:'y',order:2},
    {label:'불량',data:data.map(r=>Math.round(r.defect)),type:'line',borderColor:'#ef4444',borderWidth:2,pointRadius:3,pointBackgroundColor:'#ef4444',yAxisID:'y1',tension:.3,order:1},
    {label:'시간(분)',data:data.map(r=>Math.round(r.time)),type:'line',borderColor:'#22c55e',borderWidth:2,pointRadius:3,pointBackgroundColor:'#22c55e',yAxisID:'y1',tension:.3,order:1}
  ]},options:co});
}

function makeStopChart(canvasId, data, barColorStop, barColorNon){
  return new Chart(canvasId,{type:'bar',data:{labels:data.map(r=>r['일자str']),datasets:[
    {label:'정지',data:data.map(r=>r.stop),backgroundColor:barColorStop,borderRadius:3},
    {label:'비정지',data:data.map(r=>r.cnt-r.stop),backgroundColor:barColorNon,borderRadius:3}
  ]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{labels:{color:'#94a3b8',font:{size:10}}},tooltip:{backgroundColor:'#1e293b',bodyColor:'#e2e8f0'}},scales:{
    x:{stacked:true,ticks:{color:'#94a3b8',font:{size:10}},grid:{color:'#1e293b'}},
    y:{stacked:true,ticks:{color:'#94a3b8'},grid:{color:'#334155'}}
  }}});
}

function renderAll(){
  charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[];

  // KPI
  const ls=D.lineSummary||{};
  // 오늘(마지막 날짜) / 어제(그 전날) 데이터
  const todayData=D.daily[D.daily.length-1]||{cnt:0,defect:0,time:0,stop:0};
  const yesterData=D.daily.length>=2?D.daily[D.daily.length-2]:{cnt:0,defect:0,time:0,stop:0};
  document.getElementById('kpiArea').innerHTML=`
    <div class="kpi-item"><div class="v">${D.totalRec.toLocaleString()}</div><div class="l">총 건수</div></div>
    <div class="kpi-item"><div class="v" style="color:#ef4444">${D.totalDef.toLocaleString()}</div><div class="l">총 불량</div></div>
    <div class="kpi-item"><div class="v" style="color:#f59e0b">${D.totalTime.toLocaleString()}</div><div class="l">총 시간(분)</div></div>
    <div class="kpi-item"><div class="v" style="color:#a855f7">${D.stopCnt.toLocaleString()}</div><div class="l">정지건수</div></div>
    <div class="kpi-item"><div class="v" style="color:#38bdf8">${todayData.cnt.toLocaleString()}</div><div class="l">오늘 (${todayData['일자str']})</div></div>
    <div class="kpi-item"><div class="v" style="color:#94a3b8">${yesterData.cnt.toLocaleString()}</div><div class="l">어제 (${yesterData['일자str']})</div></div>
    <div class="kpi-item"><div class="v" style="color:#06b6d4">${(ls.G||{}).cnt||'?'}</div><div class="l">G Line</div></div>
    <div class="kpi-item"><div class="v" style="color:#22c55e">${(ls.H||{}).cnt||'?'}</div><div class="l">H Line</div></div>
    <div class="kpi-item"><div class="v" style="color:#f59e0b">${(ls.K||{}).cnt||'?'}</div><div class="l">K Line</div></div>`;

  document.getElementById('info').textContent=`${D.dateRange} | PM调整 Only | 停机/开机 제외 | >1000분 제외 | 설비 ${D.eqCnt}대`;

  document.getElementById('tabArea').innerHTML=`
    <div class="tab on" onclick="go(0)">📅 일자별 추이</div>
    <div class="tab" onclick="go(1)">🔥 히트맵(불량/일자)</div>
    <div class="tab" onclick="go(2)">🔥 히트맵(시간/일자)</div>`;

  const root=document.getElementById('root');
  const legend='<div class="lg"><div class="li"><div class="lc" style="background:#1e293b;border:1px solid #334155"></div>0</div><div class="li"><div class="lc" style="background:rgba(59,130,246,0.3)"></div>Low</div><div class="li"><div class="lc" style="background:rgba(251,191,36,0.5)"></div>Mid</div><div class="li"><div class="lc" style="background:rgba(239,68,68,0.7)"></div>High</div></div>';

  root.innerHTML=`
  <!-- TAB 0: 일자별 추이 -->
  <div class="pn on">
    <div class="bx"><h3>📅 전체 일자별 건수 / 불량수량 / 정지시간<em>Total ${D.totalRec}건</em></h3><canvas id="dAll"></canvas></div>
    <div class="bx"><h3>📅 전체 정지 vs 비정지<em>Stacked</em></h3><canvas id="dAllS"></canvas></div>
    <hr style="border:1px solid #334155;margin:20px 0">
    <div class="bx" style="border-left:3px solid #06b6d4"><h3><span class="line-label" style="background:#06b6d420;color:#06b6d4">G Line</span> 일자별 건수 / 불량 / 시간<em>${(ls.G||{}).cnt||0}건 · 설비 ${(ls.G||{}).eq||0}대</em></h3><canvas id="dG"></canvas></div>
    <div class="bx" style="border-left:3px solid #06b6d4"><h3><span class="line-label" style="background:#06b6d420;color:#06b6d4">G Line</span> 정지 vs 비정지</h3><canvas id="dGS"></canvas></div>
    <hr style="border:1px solid #334155;margin:20px 0">
    <div class="bx" style="border-left:3px solid #22c55e"><h3><span class="line-label" style="background:#22c55e20;color:#22c55e">H Line</span> 일자별 건수 / 불량 / 시간<em>${(ls.H||{}).cnt||0}건 · 설비 ${(ls.H||{}).eq||0}대</em></h3><canvas id="dH"></canvas></div>
    <div class="bx" style="border-left:3px solid #22c55e"><h3><span class="line-label" style="background:#22c55e20;color:#22c55e">H Line</span> 정지 vs 비정지</h3><canvas id="dHS"></canvas></div>
    <hr style="border:1px solid #334155;margin:20px 0">
    <div class="bx" style="border-left:3px solid #f59e0b"><h3><span class="line-label" style="background:#f59e0b20;color:#f59e0b">K Line</span> 일자별 건수 / 불량 / 시간<em>${(ls.K||{}).cnt||0}건 · 설비 ${(ls.K||{}).eq||0}대</em></h3><canvas id="dK"></canvas></div>
    <div class="bx" style="border-left:3px solid #f59e0b"><h3><span class="line-label" style="background:#f59e0b20;color:#f59e0b">K Line</span> 정지 vs 비정지</h3><canvas id="dKS"></canvas></div>
  </div>

  <!-- TAB 1: 히트맵(불량) -->
  <div class="pn"><div class="bx"><h3>🔥 설비 일자별 불량수량</h3>${legend}<div class="hc" id="hm_def"></div></div></div>

  <!-- TAB 2: 히트맵(시간) -->
  <div class="pn"><div class="bx"><h3>🔥 설비 일자별 조정시간(분)</h3>${legend}<div class="hc" id="hm_time"></div></div></div>`;

  // === Charts ===
  charts.push(makeDailyChart('dAll', D.daily, 'Total', '#3b82f6'));
  charts.push(makeStopChart('dAllS', D.daily, '#ef4444', '#22c55e'));

  charts.push(makeDailyChart('dG', D.daily_G, 'G Line', '#06b6d4'));
  charts.push(makeStopChart('dGS', D.daily_G, '#ef4444', '#06b6d4'));

  charts.push(makeDailyChart('dH', D.daily_H, 'H Line', '#22c55e'));
  charts.push(makeStopChart('dHS', D.daily_H, '#ef4444', '#22c55e'));

  charts.push(makeDailyChart('dK', D.daily_K, 'K Line', '#f59e0b'));
  charts.push(makeStopChart('dKS', D.daily_K, '#ef4444', '#f59e0b'));

  // Heatmaps
  document.getElementById('hm_def').innerHTML=buildDailyHT(D.hm_def,'불량수량',D.eq_order,D.all_dates);
  document.getElementById('hm_time').innerHTML=buildDailyHT(D.hm_time,'time',D.eq_order,D.all_dates);
}

renderAll();
</script>
</body>
</html>
